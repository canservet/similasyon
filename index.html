      // =========================================================================
      // KURUŞ BAZLI HESAPLAMA MOTORU VE TÜRKÇE SAYI BİÇİMLENDİRME
      // =========================================================================
      function toKurus(tl) {
        if (!Number.isFinite(tl) || tl < 0) return 0;
        return Math.round(tl * 100);
      }

      function fromKurus(kurus) {
        return kurus / 100;
      }

      function formatTL(tl) {
        const safe = Number.isFinite(tl) ? tl : 0;
        return new Intl.NumberFormat('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(safe) + ' TL';
      }

      function formatSayi(tl) {
        const safe = Number.isFinite(tl) ? tl : 0;
        return new Intl.NumberFormat('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(safe);
      }

      // Tek merkezi VERGI_TARIFESI veri yapısını kullanan kuruş hassasiyetli motor
      function kumulatifVergiHesaplaKurus(matrahKurus) {
        if (matrahKurus <= 0) return 0;
        let toplamVergiKurus = 0;
        for (const dilim of VERGI_TARIFESI.dilimler) {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          if (matrahKurus > altKurus) {
            const dilimdekiMatrahKurus = Math.min(matrahKurus, ustKurus) - altKurus;
            toplamVergiKurus += Math.round(dilimdekiMatrahKurus * dilim.oran);
          }
        }
        return toplamVergiKurus;
      }

      function kumulatifVergiHesapla(matrahTL) {
        return fromKurus(kumulatifVergiHesaplaKurus(toKurus(matrahTL)));
      }

      // Kümülatif matrahın tüm dilimlere dağılımı
      function kumulatifDilimDagilimi(matrahTL) {
        const matrahKurus = toKurus(matrahTL);
        return VERGI_TARIFESI.dilimler.map((dilim) => {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          const vergilendirilenKurus = matrahKurus > altKurus
            ? Math.max(0, Math.min(matrahKurus, ustKurus) - altKurus)
            : 0;
          const vergiKurus = Math.round(vergilendirilenKurus * dilim.oran);
          return {
            ...dilim,
            vergilendirilenTutar: fromKurus(vergilendirilenKurus),
            vergi: fromKurus(vergiKurus),
            aktif: vergilendirilenKurus > 0,
          };
        });
      }

      // Cari ay matrahının [onceki, onceki + cari] aralığında hangi dilimlere dağıldığı
      function cariAyDilimDagilimi(oncekiTL, cariTL) {
        const oncekiKurus = toKurus(oncekiTL);
        const yeniKurus = oncekiKurus + toKurus(cariTL);
        return VERGI_TARIFESI.dilimler.map((dilim) => {
          const altKurus = dilim.altSinir * 100;
          const ustKurus = dilim.ustSinir === null ? Infinity : dilim.ustSinir * 100;
          const kesisimBaslangic = Math.max(oncekiKurus, altKurus);
          const kesisimBitis = Math.min(yeniKurus, ustKurus);
          const cariDilimKurus = Math.max(0, kesisimBitis - kesisimBaslangic);
          const cariVergiKurus = Math.round(cariDilimKurus * dilim.oran);
          return {
            ...dilim,
            cariDilimTutar: fromKurus(cariDilimKurus),
            cariDilimVergi: fromKurus(cariVergiKurus),
            aktif: cariDilimKurus > 0,
          };
        });
      }

      function parsePozitifSayi(raw) {
        if (raw === '' || raw === null || raw === undefined) {
          return { gecerli: true, deger: 0, bos: true, hata: '' };
        }
        const normalized = String(raw).replace(',', '.');
        const num = Number(normalized);
        if (!Number.isFinite(num)) {
          return { gecerli: false, deger: 0, bos: false, hata: 'Lütfen geçerli bir sayı giriniz.' };
        }
        if (num < 0) {
          return { gecerli: false, deger: 0, bos: false, hata: 'Negatif tutar girilemez; lütfen 0 veya daha büyük bir tutar yazınız.' };
        }
        return { gecerli: true, deger: num, bos: false, hata: '' };
      }

      // =========================================================================
      // YATAY DİLİM DAĞILIMI GÖRSEL BİLEŞENİ (Gelir Vergisi Akademisi)
      // =========================================================================
      function YatayDilimDagilimGorseli({ oncekiMatrah = 0, cariMatrah = 0, gosterOncekiAyrim = false }) {
        const toplamMatrah = Math.max(0, oncekiMatrah + cariMatrah);
        const dagilim = kumulatifDilimDagilimi(toplamMatrah);
        const aktifDilimler = dagilim.filter((d) => d.vergilendirilenTutar > 0);

        // Görsel bar genişliği için toplam matrah (0 ise referans 190.000)
        const referansToplam = toplamMatrah > 0 ? toplamMatrah : 190000;
        const oncekiYuzde = toplamMatrah > 0 ? Math.min(100, (oncekiMatrah / referansToplam) * 100) : 0;

        return (
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h4 className="text-sm font-semibold text-white">Kümülatif Matrahın Vergi Dilimlerine Dağılımı</h4>
                <p className="text-xs text-slate-400 mt-0.5">
                  Toplam matrahın her parçası yalnızca kendi aralığındaki oranla vergilendirilir.
                </p>
              </div>
              <div className="text-sm font-mono tabular-nums font-semibold text-slate-100">
                Toplam: {formatTL(toplamMatrah)}
              </div>
            </div>

            {/* Yatay Yığılmış Çubuk (Horizontal Stacked Bar) */}
            <div className="relative">
              <div className="w-full h-11 bg-slate-950 border border-slate-800 rounded-lg overflow-hidden flex">
                {toplamMatrah === 0 ? (
                  <div className="w-full h-full flex items-center justify-center text-xs text-slate-500">
                    Matrah 0,00 TL — Dağılım görmek için tutar giriniz
                  </div>
                ) : (
                  aktifDilimler.map((d) => {
                    const genislikYuzde = (d.vergilendirilenTutar / toplamMatrah) * 100;
                    return (
                      <div
                        key={d.id}
                        style={{ width: `${genislikYuzde}%` }}
                        className={`${d.barClass} h-full flex items-center justify-center px-1.5 text-slate-950 font-semibold text-xs border-r border-slate-950/30 last:border-r-0 transition-all duration-200 overflow-hidden`}
                        title={`${d.ad}: ${formatTL(d.vergilendirilenTutar)} (${d.oranYuzde})`}
                      >
                        {genislikYuzde >= 11 ? (
                          <span className="truncate font-mono tabular-nums">{d.oranYuzde}</span>
                        ) : null}
                      </div>
                    );
                  })
                )}
              </div>

              {/* Önceki Kümülatif Matrah Sınır İşaretçisi */}
              {gosterOncekiAyrim && toplamMatrah > 0 && oncekiMatrah > 0 && cariMatrah > 0 && (
                <div className="mt-2 flex items-center gap-3 text-xs text-slate-300">
                  <div className="flex-1 bg-slate-950 border border-slate-800 rounded-md h-2.5 overflow-hidden flex">
                    <div
                      style={{ width: `${oncekiYuzde}%` }}
                      className="bg-slate-600 h-full"
                      title={`Önceki kümülatif matrah: ${formatTL(oncekiMatrah)}`}
                    />
                    <div
                      style={{ width: `${100 - oncekiYuzde}%` }}
                      className="bg-emerald-500 h-full"
                      title={`Cari ay matrahı: ${formatTL(cariMatrah)}`}
                    />
                  </div>
                  <div className="flex items-center gap-3 shrink-0 font-mono tabular-nums text-[11px]">
                    <span className="text-slate-400">Önceki: {formatTL(oncekiMatrah)}</span>
                    <span className="text-emerald-400 font-semibold">+ Cari Ay: {formatTL(cariMatrah)}</span>
                  </div>
                </div>
              )}
            </div>

            {/* Dilim Etiketleri ve Tutarları (Renk tek başına değil, oran + tutar ile birlikte) */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
              {dagilim.map((d) => (
                <div
                  key={d.id}
                  className={`rounded-lg border p-3 transition-colors ${
                    d.aktif
                      ? `${d.softBgClass} ${d.borderClass}`
                      : 'bg-slate-950/60 border-slate-800/80 opacity-60'
                  }`}
                >
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className={`w-2.5 h-2.5 rounded-sm shrink-0 ${d.barClass}`} aria-hidden="true" />
                      <span className="text-xs font-semibold text-white truncate">{d.oranYuzde} Dilimi</span>
                    </div>
                    <span className="text-[11px] font-mono text-slate-400 shrink-0">
                      {d.aktif ? 'Aktif' : 'Boş'}
                    </span>
                  </div>
                  <div className="mt-2 font-mono tabular-nums text-xs text-slate-200 font-semibold">
                    {formatTL(d.vergilendirilenTutar)}
                  </div>
                  <div className="mt-0.5 font-mono tabular-nums text-[11px] text-slate-400">
                    Vergi: {formatTL(d.vergi)}

      }

      // =========================================================================
      // MODÜL 1: TEMEL HESAPLAMA MODÜLÜ (BRÜTTEN NETE VE İŞVEREN MALİYETİ)
      // =========================================================================
      const ISVEREN_SEKTORLERI = {
        uretim: {
          id: 'uretim',
          ad: 'Üretim Firması (İmalat)',
          kisaAd: 'Üretim Firması',
          indirimBilgisi: '5 Puan Hazine İndirimi',
          aciklama: 'İmalat sektörü işletmeleri için baz %21,75 SGK işveren oranından 5 puan Hazine indirimi uygulanır.',
          sgkIsverenOran: 0.1675,
          sgkOranYuzde: '%16,75',
          sgkCarpaniYazi: '0,1675',
          issizlikIsverenOran: 0.02,
          issizlikOranYuzde: '%2,00',
          toplamOranYuzde: '%18,75',
        },
        hizmet: {
          id: 'hizmet',
          ad: 'Hizmet Firması',
          kisaAd: 'Hizmet Firması',
          indirimBilgisi: '2 Puan Hazine İndirimi',
          aciklama: 'Hizmet ve diğer sektör işletmeleri için baz %21,75 SGK işveren oranından 2 puan Hazine indirimi uygulanır.',
          sgkIsverenOran: 0.1975,
          sgkOranYuzde: '%19,75',
          sgkCarpaniYazi: '0,1975',
          issizlikIsverenOran: 0.02,
          issizlikOranYuzde: '%2,00',
          toplamOranYuzde: '%21,75',
        },
      };

      function BruttenNeteModulu() {
        const [activeStep, setActiveStep] = useState(1);
        const [grossSalary, setGrossSalary] = useState(30000);
        const [firmaTuru, setFirmaTuru] = useState('uretim');
        const [inputs, setInputs] = useState({
          sgkWorkerInput: '',
          unemploymentInput: '',
          taxBaseInput: '',
          incomeTaxInput: '',
          stampTaxInput: '',
          netSalaryInput: '',
          sgkEmployerInput: '',
          employerUnemploymentInput: '',
          totalEmployerCostInput: '',
        });

        const parseGirdi = (val) => {
          if (val === '' || val === null || val === undefined) return NaN;
          return parseFloat(String(val).replace(',', '.'));
        };

        const seciliSektor = ISVEREN_SEKTORLERI[firmaTuru];
        const digerSektorKey = firmaTuru === 'uretim' ? 'hizmet' : 'uretim';
        const digerSektor = ISVEREN_SEKTORLERI[digerSektorKey];

        const correctSgkWorker = Math.round(grossSalary * 0.14 * 100) / 100;
        const correctUnemployment = Math.round(grossSalary * 0.01 * 100) / 100;
        const correctTaxBase = Math.round((grossSalary - correctSgkWorker - correctUnemployment) * 100) / 100;
        const correctIncomeTax = Math.round(correctTaxBase * 0.15 * 100) / 100;
        const correctStampTax = Math.round(grossSalary * 0.00759 * 100) / 100;
        const correctNetSalary = Math.round((grossSalary - correctSgkWorker - correctUnemployment - correctIncomeTax - correctStampTax) * 100) / 100;

        // İşveren maliyeti hesaplamaları (kuruş hassasiyetli tam sayı yuvarlama)
        const grossKurus = toKurus(grossSalary);
        const correctSgkEmployer = fromKurus(Math.round(grossKurus * seciliSektor.sgkIsverenOran));
        const correctEmployerUnemployment = fromKurus(Math.round(grossKurus * seciliSektor.issizlikIsverenOran));
        const correctTotalEmployerCost = fromKurus(
          grossKurus + toKurus(correctSgkEmployer) + toKurus(correctEmployerUnemployment)
        );

        const digerSgkEmployer = fromKurus(Math.round(grossKurus * digerSektor.sgkIsverenOran));
        const digerTotalEmployerCost = fromKurus(
          grossKurus + toKurus(digerSgkEmployer) + toKurus(correctEmployerUnemployment)
        );
        const sektorFarkiTL = Math.abs(Math.round((correctTotalEmployerCost - digerTotalEmployerCost) * 100) / 100);

        const isSgkWorkerCorrect = inputs.sgkWorkerInput !== '' && Math.abs(parseGirdi(inputs.sgkWorkerInput) - correctSgkWorker) < 1;
        const isUnemploymentCorrect = inputs.unemploymentInput !== '' && Math.abs(parseGirdi(inputs.unemploymentInput) - correctUnemployment) < 1;
        const isTaxBaseCorrect = inputs.taxBaseInput !== '' && Math.abs(parseGirdi(inputs.taxBaseInput) - correctTaxBase) < 1;
        const isIncomeTaxCorrect = inputs.incomeTaxInput !== '' && Math.abs(parseGirdi(inputs.incomeTaxInput) - correctIncomeTax) < 1;
        const isStampTaxCorrect = inputs.stampTaxInput !== '' && Math.abs(parseGirdi(inputs.stampTaxInput) - correctStampTax) < 1;
        const isNetSalaryCorrect = inputs.netSalaryInput !== '' && Math.abs(parseGirdi(inputs.netSalaryInput) - correctNetSalary) < 1;

        const isSgkEmployerCorrect = inputs.sgkEmployerInput !== '' && Math.abs(parseGirdi(inputs.sgkEmployerInput) - correctSgkEmployer) < 0.5;
        const isEmployerUnemploymentCorrect = inputs.employerUnemploymentInput !== '' && Math.abs(parseGirdi(inputs.employerUnemploymentInput) - correctEmployerUnemployment) < 0.5;
        const isTotalEmployerCostCorrect = inputs.totalEmployerCostInput !== '' && Math.abs(parseGirdi(inputs.totalEmployerCostInput) - correctTotalEmployerCost) < 0.5;
        const isEmployerStepDone = isSgkEmployerCorrect && isEmployerUnemploymentCorrect && isTotalEmployerCostCorrect;

        const handleInputChange = (field, value) => {
          setInputs(prev => ({ ...prev, [field]: value }));
        };

        const handleFirmaTuruChange = (yeniTur) => {
          if (yeniTur === firmaTuru) return;
          setFirmaTuru(yeniTur);
          setInputs(prev => ({
            ...prev,
            sgkEmployerInput: '',
            totalEmployerCostInput: '',
          }));
        };

        const resetAllInputs = () => {
          setInputs({
            sgkWorkerInput: '',
            unemploymentInput: '',
            taxBaseInput: '',
            incomeTaxInput: '',
            stampTaxInput: '',
            netSalaryInput: '',
            sgkEmployerInput: '',
            employerUnemploymentInput: '',
            totalEmployerCostInput: '',
          });
        };

        const handleGrossChange = (val) => {
          const safe = val < 0 ? 0 : val;
          setGrossSalary(safe);
          resetAllInputs();
        };

        return (
          <div className="flex flex-col gap-6">
            {/* Üst Özet Akış Barı */}
            <div className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 overflow-x-auto">
              <div className="flex items-center gap-2 min-w-max text-xs font-mono tabular-nums">
                <div className="flex items-center gap-1.5 bg-sky-950/60 border border-sky-500/40 px-3 py-1.5 rounded-lg text-sky-200">
                  <span className="font-sans font-semibold">Brüt:</span>
                  <span className="font-bold text-white">{formatTL(grossSalary)}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 1 ? (isSgkWorkerCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- SGK (%14):</span>
                  <span className="font-bold">{isSgkWorkerCorrect ? formatTL(correctSgkWorker) : '...'}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 1 ? (isUnemploymentCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- İşsizlik (%1):</span>
                  <span className="font-bold">{isUnemploymentCorrect ? formatTL(correctUnemployment) : '...'}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 2 ? (isTaxBaseCorrect ? 'bg-indigo-950/60 border-indigo-500/50 text-indigo-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">GV Matrahı:</span>
                  <span className="font-bold">{isTaxBaseCorrect ? formatTL(correctTaxBase) : '...'}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 2 ? (isIncomeTaxCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- Gelir V. (%15):</span>
                  <span className="font-bold">{isIncomeTaxCorrect ? formatTL(correctIncomeTax) : '...'}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${activeStep >= 3 ? (isStampTaxCorrect ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300') : 'bg-slate-950/50 border-slate-800 text-slate-500'}`}>
                  <span className="font-sans">- Damga (0.00759):</span>
                  <span className="font-bold">{isStampTaxCorrect ? formatTL(correctStampTax) : '...'}</span>
                </div>

                <IconChevronRight />

                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${activeStep >= 3 && isNetSalaryCorrect ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">Net Ücret:</span>
                  <span>{activeStep >= 3 && isNetSalaryCorrect ? formatTL(correctNetSalary) : 'Hesaplanıyor...'}</span>
                </div>

                <span className="text-slate-700 px-1">|</span>

                <div className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border font-bold ${isEmployerStepDone ? 'bg-amber-600 text-white border-amber-400' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                  <span className="font-sans">İşveren ({seciliSektor.kisaAd}):</span>
                  <span>{isEmployerStepDone ? formatTL(correctTotalEmployerCost) : '...'}</span>
                </div>
              </div>
            </div>

            {/* Adım Seçim Sekmeleri */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              {[
                { step: 1, title: '1. Brüt ve SGK', desc: 'Brüt Ücret ve İşçi SGK' },
                { step: 2, title: '2. Matrah ve GV', desc: 'Matrah ve %15 Gelir V.' },
                { step: 3, title: '3. Damga ve Net', desc: 'Damga ve Net Ücret' },
                { step: 4, title: '4. Bordro Özeti', desc: 'Personel Bordro Karnesi' },
                { step: 5, title: '5. İşveren Maliyeti', desc: 'Üretim / Hizmet Seçimi' },
              ].map((item) => {
                const done =
                  (item.step === 1 && isSgkWorkerCorrect && isUnemploymentCorrect) ||
                  (item.step === 2 && isTaxBaseCorrect && isIncomeTaxCorrect) ||
                  (item.step === 3 && isStampTaxCorrect && isNetSalaryCorrect) ||
                  (item.step === 5 && isEmployerStepDone);
                return (
                  <button
                    key={item.step}
                    onClick={() => setActiveStep(item.step)}
                    className={`p-3.5 rounded-xl border text-left transition-colors flex flex-col gap-1 cursor-pointer min-h-[44px] ${
                      activeStep === item.step
                        ? 'bg-slate-800 border-sky-500 text-white'
                        : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                      <span>Adım {item.step} / 5</span>
                      {done && <IconCheck />}
                    </div>
                    <div className="font-semibold text-sm text-white truncate">{item.title}</div>
                    <div className="text-xs text-slate-400 truncate">{item.desc}</div>
                  </button>
                );
              })}
            </div>

            {/* ADIM 1 */}
            {activeStep === 1 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                <div className="border-b border-slate-800 pb-5">
                  <div className="text-xs text-sky-400 font-medium">Adım 1 / 5 · Sosyal Güvenlik Kesintileri</div>
                  <h2 className="text-xl sm:text-2xl font-bold text-white mt-1">Brüt Ücret Girişi ve SGK Kesintileri</h2>
                  <p className="text-sm text-slate-300 mt-1 max-w-3xl">
                    Öncelikle hesaplama yapmak istediğiniz brüt ücret tutarını girin. Ardından %14 SGK işçi primi ve %1 işsizlik sigortası primini hesaplayıp ilgili kutulara yazın.
                  </p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                  <label htmlFor="brut-input" className="block text-xs font-semibold text-slate-300 mb-2">
                    Hesaplanacak Brüt Ücret Tutarı (TL)
                  </label>
                  <div className="relative max-w-md">
                    <input
                      id="brut-input"
                      type="number"
                      value={grossSalary}
                      onChange={(e) => handleGrossChange(Number(e.target.value) || 0)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white font-mono tabular-nums font-bold text-xl text-right pr-12 focus:outline-none focus:ring-2 focus:ring-sky-500 min-h-[44px]"
                      step="1000"
                      min="0"
                    />
                    <span className="absolute right-4 top-3.5 text-slate-400 font-mono text-sm">TL</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* SGK %14 */}
                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.sgkWorkerInput === ''
                      ? 'border-slate-800'
                      : isSgkWorkerCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'
                  }`}>
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-semibold text-slate-100">%14 SGK İşçi Primi</span>
                        {inputs.sgkWorkerInput !== '' && (isSgkWorkerCorrect ? <IconCheck /> : <IconX />)}
                      </div>
                      <p className="text-xs text-slate-400 mt-1 font-mono">Formül: Brüt Ücret × 0,14</p>
                    </div>

                    <div className="mt-4 flex flex-col gap-2">
                      <div className="relative">
                        <input
                          type="number"
                          placeholder="Tutar giriniz..."
                          value={inputs.sgkWorkerInput}
                          onChange={(e) => handleInputChange('sgkWorkerInput', e.target.value)}
                          className={`w-full bg-slate-900 border rounded-lg px-3 py-2.5 font-mono tabular-nums font-bold text-right pr-10 focus:outline-none focus:ring-2 min-h-[44px] ${
                            inputs.sgkWorkerInput === ''
                              ? 'border-slate-700 text-white focus:ring-sky-500'
                              : isSgkWorkerCorrect
                                ? 'border-emerald-500 focus:ring-emerald-500 text-emerald-300'
                                : 'border-rose-500 focus:ring-rose-500 text-rose-300'
                          }`}
                        />
                        <span className="absolute right-3 top-3 text-slate-400 text-xs font-mono">TL</span>
                      </div>
                      {inputs.sgkWorkerInput !== '' && !isSgkWorkerCorrect && (
                        <span className="text-xs text-rose-400 font-medium flex items-center gap-1.5">
                          <IconInfo /> Hatalı hesaplama. İpucu: Brüt tutarın %14'ünü hesaplayın.
                        </span>
                      )}
                      {isSgkWorkerCorrect && (
                        <span className="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                          <IconCheck /> Doğru hesapladınız.
                        </span>
                      )}
                    </div>
                  </div>

                  {/* İşsizlik %1 */}
                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.unemploymentInput === ''
                      ? 'border-slate-800'
                      : isUnemploymentCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'
                  }`}>
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-semibold text-slate-100">%1 İşsizlik Sigortası</span>
                        {inputs.unemploymentInput !== '' && (isUnemploymentCorrect ? <IconCheck /> : <IconX />)}
                      </div>
                      <p className="text-xs text-slate-400 mt-1 font-mono">Formül: Brüt Ücret × 0,01</p>
                    </div>

                    <div className="mt-4 flex flex-col gap-2">
                      <div className="relative">
                        <input
                          type="number"
                          placeholder="Tutar giriniz..."
                          value={inputs.unemploymentInput}
                          onChange={(e) => handleInputChange('unemploymentInput', e.target.value)}
                          className={`w-full bg-slate-900 border rounded-lg px-3 py-2.5 font-mono tabular-nums font-bold text-right pr-10 focus:outline-none focus:ring-2 min-h-[44px] ${
                            inputs.unemploymentInput === ''
                              ? 'border-slate-700 text-white focus:ring-sky-500'
                              : isUnemploymentCorrect
                                ? 'border-emerald-500 focus:ring-emerald-500 text-emerald-300'
                                : 'border-rose-500 focus:ring-rose-500 text-rose-300'
                          }`}
                        />
                        <span className="absolute right-3 top-3 text-slate-400 text-xs font-mono">TL</span>
                      </div>
                      {inputs.unemploymentInput !== '' && !isUnemploymentCorrect && (
                        <span className="text-xs text-rose-400 font-medium flex items-center gap-1.5">
                          <IconInfo /> Hatalı hesaplama. İpucu: Brüt tutarın %1'ini hesaplayın.
                        </span>
                      )}
                      {isUnemploymentCorrect && (
                        <span className="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                          <IconCheck /> Doğru hesapladınız.
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {/* İki veri de doğru girildikten sonra görünen yeşil kutu */}
                {isSgkWorkerCorrect && isUnemploymentCorrect && (
                  <div className="bg-emerald-950/40 border border-emerald-500 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <div className="text-xs text-emerald-300 font-semibold">1. Adım Tamamlandı · Hesaplanan Matrah</div>
                      <h4 className="font-bold text-white text-base mt-0.5">Gelir Vergisi Matrahı (Brüt - SGK - İşsizlik)</h4>
                      <p className="text-xs text-slate-300 mt-1">İki kesintiyi de doğru girdiniz. 2. adımda kullanılacak matrah tutarı:</p>
                    </div>
                    <div className="bg-emerald-900/70 border border-emerald-400/60 px-5 py-3 rounded-lg text-right shrink-0">
                      <div className="text-xs text-emerald-200 font-medium">Gelir Vergisi Matrahı</div>
                      <div className="text-2xl font-mono tabular-nums font-bold text-white">{formatTL(correctTaxBase)}</div>
                    </div>
                  </div>
                )}

                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-4 border-t border-slate-800">
                  <div className="text-xs text-slate-400">
                    {isSgkWorkerCorrect && isUnemploymentCorrect ? (
                      <span className="text-emerald-400 font-semibold flex items-center gap-1.5">
                        <IconCheck /> 1. Adım tamamlandı. 2. adıma geçebilirsiniz.
                      </span>
                    ) : (
                      <span>Devam etmek için iki kesinti kutusunu da doğru değerlerle doldurunuz.</span>
                    )}
                  </div>
                  <button
                    disabled={!isSgkWorkerCorrect || !isUnemploymentCorrect}
                    onClick={() => setActiveStep(2)}
                    className={`flex items-center justify-center gap-2 px-6 py-2.5 rounded-lg font-semibold text-sm transition-colors whitespace-nowrap shrink-0 min-h-[44px] ${
                      isSgkWorkerCorrect && isUnemploymentCorrect
                        ? 'bg-sky-600 hover:bg-sky-500 text-white cursor-pointer'
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                    }`}
                  >
                    <span>İkinci Adıma Geç</span>
                    <IconArrowRight />
                  </button>
                </div>
              </div>
            )}

            {/* ADIM 2 */}
            {activeStep === 2 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                <div className="border-b border-slate-800 pb-5">
                  <div className="text-xs text-sky-400 font-medium">Adım 2 / 5 · Matrah ve İlk Dilim Vergisi</div>
                  <h2 className="text-xl sm:text-2xl font-bold text-white mt-1">Gelir Vergisi Matrahı ve %15 Gelir Vergisi Kesintisi</h2>
                  <p className="text-sm text-slate-300 mt-1 max-w-3xl">
                    Brüt ücretten SGK işçi payı ve işsizlik sigortası çıkarılarak Gelir Vergisi Matrahı bulunur. Bu aşamada ilk dilim olan %15 üzerinden gelir vergisi hesaplanır.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.taxBaseInput === ''
                      ? 'border-slate-800'
                      : isTaxBaseCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'
                  }`}>
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-semibold text-slate-100">Gelir Vergisi Matrahı</span>
                        {inputs.taxBaseInput !== '' && (isTaxBaseCorrect ? <IconCheck /> : <IconX />)}
                      </div>
                      <p className="text-xs text-slate-400 mt-1 font-mono">Brüt ({formatTL(grossSalary)}) - SGK - İşsizlik</p>
                    </div>

                    <div className="mt-4 flex flex-col gap-2">
                      <div className="relative">
                        <input
                          type="number"
                          placeholder="Tutar giriniz..."
                          value={inputs.taxBaseInput}
                          onChange={(e) => handleInputChange('taxBaseInput', e.target.value)}
                          className={`w-full bg-slate-900 border rounded-lg px-3 py-2.5 font-mono tabular-nums font-bold text-right pr-10 focus:outline-none focus:ring-2 min-h-[44px] ${
                            inputs.taxBaseInput === ''
                              ? 'border-slate-700 text-white focus:ring-sky-500'
                              : isTaxBaseCorrect
                                ? 'border-emerald-500 focus:ring-emerald-500 text-emerald-300'
                                : 'border-rose-500 focus:ring-rose-500 text-rose-300'
                          }`}
                        />
                        <span className="absolute right-3 top-3 text-slate-400 text-xs font-mono">TL</span>
                      </div>
                      {inputs.taxBaseInput !== '' && !isTaxBaseCorrect && (
                        <span className="text-xs text-rose-400 font-medium flex items-center gap-1.5">
                          <IconInfo /> Hatalı. İpucu: Brüt ücretten SGK (%14) ve İşsizlik (%1) primlerini düşün.
                        </span>
                      )}
                      {isTaxBaseCorrect && (
                        <span className="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                          <IconCheck /> Matrahı doğru hesapladınız.
                        </span>
                      )}
                    </div>
                  </div>

                  <div className={`bg-slate-950 border rounded-xl p-5 flex flex-col justify-between transition-colors ${
                    inputs.incomeTaxInput === ''
                      ? 'border-slate-800'
                      : isIncomeTaxCorrect
                        ? 'border-emerald-500/70 bg-emerald-950/20'
                        : 'border-rose-500/70 bg-rose-950/20'

      // =========================================================================
      // MODÜL 2: GELİR VERGİSİ AKADEMİSİ
      // =========================================================================
      function GelirVergisiAkademisi() {
        const dersBolumleri = [
          { sira: 1, baslik: "Temel Kavramlar ve Mantık" },
          { sira: 2, baslik: "Vergi Dilimlerini Tanı" },
          { sira: 3, baslik: "Kümülatif Matrah Oluşumu" },
          { sira: 4, baslik: "Dilimlere Dağılım" },
          { sira: 5, baslik: "Aylık Vergi Farkı" },
          { sira: 6, baslik: "Kendi Kendine Deneme" },
          { sira: 7, baslik: "Serbest Hesaplama Aracı" },
        ];

        const [aktifDers, setAktifDers] = useState(1);
        const [tamamlananDersler, setTamamlananDersler] = useState([1]);

        // Ders 1 Etkileşim Durumu
        const [ders1Secim, setDers1Secim] = useState(null);

        // Ders 2 Seçili Dilim Detayı
        const [seciliDilimId, setSeciliDilimId] = useState(2);

        // Ders 3 Aylık Matrah Simülatörü (12 Ay)
        const [aylikMatrahHam, setAylikMatrahHam] = useState("30000");
        const aylikMatrahKontrol = parsePozitifSayi(aylikMatrahHam);
        const aylikMatrahDeger = aylikMatrahKontrol.gecerli ? aylikMatrahKontrol.deger : 0;

        // Ders 4 Dağılım Örneği (Varsayılan 210.000 TL)
        const [ders4MatrahHam, setDers4MatrahHam] = useState("210000");
        const ders4Kontrol = parsePozitifSayi(ders4MatrahHam);
        const ders4Matrah = ders4Kontrol.gecerli ? ders4Kontrol.deger : 0;

        // Ders 5 Önceki & Cari Ay Örneği (Varsayılan 180.000 + 30.000)
        const [ders5OncekiHam, setDers5OncekiHam] = useState("180000");
        const [ders5CariHam, setDers5CariHam] = useState("30000");
        const ders5OncekiKontrol = parsePozitifSayi(ders5OncekiHam);
        const ders5CariKontrol = parsePozitifSayi(ders5CariHam);
        const ders5Onceki = ders5OncekiKontrol.gecerli ? ders5OncekiKontrol.deger : 0;
        const ders5Cari = ders5CariKontrol.gecerli ? ders5CariKontrol.deger : 0;

        // Ders 6 Quiz + Uygulamalı Hesap Alıştırması
        const [quizYanitlari, setQuizYanitlari] = useState({});
        const [alistirmaYanitHam, setAlistirmaYanitHam] = useState("");
        const [alistirmaKontrolEdildi, setAlistirmaKontrolEdildi] = useState(false);

        // Ders 7 Serbest Hesaplama Aracı
        const [serbestOncekiHam, setSerbestOncekiHam] = useState("180000");
        const [serbestCariHam, setSerbestCariHam] = useState("30000");
        const [uyarilarAcik, setUyarilarAcik] = useState(false);

        const serbestOncekiKontrol = parsePozitifSayi(serbestOncekiHam);
        const serbestCariKontrol = parsePozitifSayi(serbestCariHam);
        const serbestOnceki = serbestOncekiKontrol.gecerli ? serbestOncekiKontrol.deger : 0;
        const serbestCari = serbestCariKontrol.gecerli ? serbestCariKontrol.deger : 0;

        const derseGit = (sira) => {
          setAktifDers(sira);
          if (!tamamlananDersler.includes(sira)) {
            setTamamlananDersler((prev) => [...prev, sira]);
          }
        };

        const ilerlemeYuzde = Math.round((tamamlananDersler.length / dersBolumleri.length) * 100);

        // Ders 3: 12 Aylık Kümülatif Tablo
        const yillikTablo = useMemo(() => {
          let birikenMatrahKurus = 0;
          let oncekiVergiKurus = 0;
          const aylikKurus = toKurus(aylikMatrahDeger);

          return AYLAR.map((ay) => {
            const oncekiMatrahKurus = birikenMatrahKurus;
            birikenMatrahKurus += aylikKurus;
            const yeniVergiKurus = kumulatifVergiHesaplaKurus(birikenMatrahKurus);
            const buAyVergiKurus = yeniVergiKurus - oncekiVergiKurus;
            oncekiVergiKurus = yeniVergiKurus;

            // Aktif üst dilimi bul
            const birikenTL = fromKurus(birikenMatrahKurus);
            let aktifDilim = VERGI_TARIFESI.dilimler[0];
            for (const d of VERGI_TARIFESI.dilimler) {
              if (birikenTL > d.altSinir) {
                aktifDilim = d;
              }
            }

            return {
              ay,
              oncekiMatrah: fromKurus(oncekiMatrahKurus),
              aylikMatrah: fromKurus(aylikKurus),
              kumulatifMatrah: birikenTL,
              kumulatifVergi: fromKurus(yeniVergiKurus),
              aylikVergi: fromKurus(buAyVergiKurus),
              aktifDilim,
            };
          });
        }, [aylikMatrahDeger]);

        // Ders 5 Hesaplamaları
        const ders5YeniMatrah = ders5Onceki + ders5Cari;
        const ders5OncekiVergi = kumulatifVergiHesapla(ders5Onceki);
        const ders5YeniVergi = kumulatifVergiHesapla(ders5YeniMatrah);
        const ders5AylikVergi = fromKurus(kumulatifVergiHesaplaKurus(ders5YeniMatrah * 100) - kumulatifVergiHesaplaKurus(ders5Onceki * 100));
        const ders5CariDilimler = cariAyDilimDagilimi(ders5Onceki, ders5Cari).filter((d) => d.aktif);

        // Ders 6 Uygulamalı Alıştırma (Senaryo: Önceki 380.000 TL, Cari Ay 40.000 TL -> Yeni 420.000 TL)
        // 380.000 -> %15 (190k * 0.15 = 28.500) + %20 (190k * 0.20 = 38.000) = 66.500 TL
        // 420.000 -> 400k (70.500) + 20k * 0.27 (5.400) = 75.900 TL
        // Cari Ay Farkı: 75.900 - 66.500 = 9.400 TL (20.000 * 0.20 = 4.000 + 20.000 * 0.27 = 5.400)
        const alistirmaBeklenen = 9400;
        const alistirmaSayi = parsePozitifSayi(alistirmaYanitHam);
        const alistirmaDogru = alistirmaKontrolEdildi && alistirmaSayi.gecerli && !alistirmaSayi.bos && Math.abs(alistirmaSayi.deger - alistirmaBeklenen) < 0.01;

        // Ders 7 Serbest Hesaplama Sonuçları
        const serbestYeniMatrah = serbestOnceki + serbestCari;
        const serbestOncekiVergiKurus = kumulatifVergiHesaplaKurus(toKurus(serbestOnceki));
        const serbestYeniVergiKurus = kumulatifVergiHesaplaKurus(toKurus(serbestYeniMatrah));
        const serbestAylikVergiKurus = serbestYeniVergiKurus - serbestOncekiVergiKurus;

        const serbestOncekiVergi = fromKurus(serbestOncekiVergiKurus);
        const serbestYeniVergi = fromKurus(serbestYeniVergiKurus);
        const serbestAylikVergi = fromKurus(serbestAylikVergiKurus);
        const serbestCariDagilim = cariAyDilimDagilimi(serbestOnceki, serbestCari);

        const seciliDilim = VERGI_TARIFESI.dilimler.find((d) => d.id === seciliDilimId) || VERGI_TARIFESI.dilimler[0];

        return (
          <div className="flex flex-col gap-6">
            {/* Ders Başlığı, Kısa Açıklama ve İlerleme Göstergesi */}
            <section className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-5">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div className="max-w-2xl">
                  <div className="text-xs text-sky-400 font-medium">Etkileşimli Eğitim Modülü · 7 Aşama</div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1" style={{ textWrap: 'balance' }}>
                    Gelir Vergisi Akademisi
                  </h2>
                  <p className="text-sm text-slate-300 mt-1.5 leading-relaxed">
                    Gelir vergisi matrahının kümülatif ilerleyişini, artan oranlı vergi dilimlerinin nasıl uygulandığını ve cari ay vergisinin iki kümülatif vergi arasındaki farktan nasıl bulunduğunu adım adım öğrenin.
                  </p>
                </div>

                <div className="w-full md:w-64 shrink-0 bg-slate-950 border border-slate-800 rounded-lg p-3.5">
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="text-slate-400">Ders İlerlemesi</span>
                    <span className="font-mono tabular-nums font-semibold text-sky-300">
                      {tamamlananDersler.length} / {dersBolumleri.length} (%{ilerlemeYuzde})
                    </span>
                  </div>
                  <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-sky-500 transition-all duration-200"
                      style={{ width: `${ilerlemeYuzde}%` }}
                    />
                  </div>
                </div>
              </div>

              {/* Aşama Sekmeleri */}
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 pt-2 border-t border-slate-800">
                {dersBolumleri.map((b) => {
                  const aktif = aktifDers === b.sira;
                  const goruldu = tamamlananDersler.includes(b.sira);
                  return (
                    <button
                      key={b.sira}
                      onClick={() => derseGit(b.sira)}
                      className={`px-3 py-2.5 rounded-lg border text-left transition-colors cursor-pointer min-h-[44px] flex flex-col justify-between gap-1 ${
                        aktif
                          ? 'bg-sky-600/20 border-sky-500 text-white'
                          : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between text-[11px] font-mono text-slate-400">
                        <span>0{b.sira}</span>
                        {goruldu && <IconCheck className="w-3.5 h-3.5 text-emerald-400 shrink-0" />}
                      </div>
                      <span className="text-xs font-semibold leading-snug line-clamp-2">{b.baslik}</span>
                    </button>
                  );
                })}
              </div>
            </section>

            {/* ============================================================== */}
            {/* AŞAMA 1: TEMEL KAVRAMLAR VE MANTIK */}
            {/* ============================================================== */}
            {aktifDers === 1 && (
              <div className="flex flex-col gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 flex flex-col gap-6">
                  <div className="border-b border-slate-800 pb-5">
                    <div className="text-xs text-sky-400 font-medium">Bölüm 1 / 7 · Temel İlkeler</div>
                    <h3 className="text-xl sm:text-2xl font-bold text-white mt-1">Gelir Vergisinin Temel Mantığı ve Kavramlar</h3>
                    <p className="text-sm text-slate-300 mt-2 leading-relaxed max-w-3xl">
                      Gelir vergisi hesaplanırken ilgili dönem boyunca biriken kümülatif gelir vergisi matrahı dikkate alınır. Matrah farklı vergi dilimlerine girebilir ve her dilime denk gelen tutar kendi oranıyla hesaplanır.
                    </p>
                  </div>

                  {/* Ana Mesaj */}
                  <div className="bg-sky-950/30 border border-sky-500/40 rounded-xl p-5">
                    <div className="text-xs font-semibold text-sky-300">Temel Kural</div>
                    <p className="text-base font-semibold text-white mt-1">
                      Üst vergi dilimine geçmek, matrahın tamamının üst oranla vergilendirileceği anlamına gelmez.
                    </p>
                  </div>

                  {/* Etkileşimli Hızlı Kontrol (250.000 TL sorusu) */}
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
                    <h4 className="text-sm font-semibold text-white">
                      Kavram Kontrolü: Kümülatif matrahı 250.000,00 TL olan bir çalışanın tüm matrahı mı, yoksa dilimlere ayrılan bölümleri mi farklı oranlarla vergilendirilir?
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <button
                        onClick={() => setDers1Secim('tek')}
                        className={`p-3.5 rounded-lg border text-left text-sm transition-colors cursor-pointer min-h-[44px] ${
                          ders1Secim === 'tek'
                            ? 'bg-rose-950/40 border-rose-500 text-rose-200'
                            : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                        }`}
                      >
                        250.000,00 TL'nin tamamı tek bir üst oran (%20) ile vergilendirilir.
                      </button>
                      <button
                        onClick={() => setDers1Secim('dilim')}
                        className={`p-3.5 rounded-lg border text-left text-sm transition-colors cursor-pointer min-h-[44px] ${
                          ders1Secim === 'dilim'
                            ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200'
                            : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                        }`}
                      >
                        Matrah dilimlere ayrılır: ilk 190.000,00 TL %15 ile, kalan 60.000,00 TL %20 ile vergilendirilir.
                      </button>
                    </div>

                    {ders1Secim === 'tek' && (
                      <div className="bg-rose-950/30 border border-rose-500/50 rounded-lg p-4 text-xs text-rose-200 flex items-start gap-2.5">
                        <IconX />
                        <div>
                          <span className="font-semibold block">Yanlış yöntem: Tüm matraha tek oran uygulanmaz.</span>
                          <p className="mt-1 text-slate-300">
                            Doğru yöntem kademeli (artan oranlı) hesaplamadır. 250.000,00 TL'nin ilk 190.000,00 TL'lik bölümü %15 diliminde (28.500,00 TL vergi) kalır; yalnızca 190.000,00 TL'yi aşan 60.000,00 TL'lik kısım %20 oranında (12.000,00 TL vergi) hesaplanır.
                          </p>
                        </div>
                      </div>
                    )}

                    {ders1Secim === 'dilim' && (
                      <div className="bg-emerald-950/30 border border-emerald-500/50 rounded-lg p-4 text-xs text-emerald-200 flex items-start gap-2.5">
                        <IconCheck />
                        <div>
                          <span className="font-semibold block">Doğru tespit!</span>
                          <p className="mt-1 text-slate-300">
                            İlk 190.000,00 TL × %15 = 28.500,00 TL ve kalan 60.000,00 TL × %20 = 12.000,00 TL olmak üzere toplam kümülatif vergi 40.500,00 TL olur.
                          </p>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 5 Temel Kavram */}
                  <div>
                    <h4 className="text-base font-semibold text-white mb-3">Temel Kavramlar Sözlüğü</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {TEMEL_KAVRAMLAR.map((k, idx) => (
                        <div key={idx} className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-2">
                          <div>
                            <div className="text-sm font-semibold text-white">{k.terim}</div>
                            <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">{k.aciklama}</p>
                          </div>
                          {k.formul && (
                            <div className="mt-2 pt-2 border-t border-slate-800/80 font-mono text-xs text-sky-300">
                              {k.formul}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Öğrenme Hedefleri */}
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                    <h4 className="text-sm font-semibold text-white mb-3">Bu Akademiyi Tamamladığınızda Kazanacaklarınız</h4>
                    <ul className="grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs text-slate-300">
                      {OGRENME_HEDEFLERI.map((hedef, idx) => (
                        <li key={idx} className="flex items-start gap-2">
                          <span className="font-mono text-sky-400 font-semibold shrink-0">0{idx + 1}.</span>
                          <span>{hedef}</span>
                        </li>
                      ))}

                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div className="text-xs text-slate-400">Yeni Kümülatif Vergi</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-sky-300 mt-1.5">{formatTL(serbestYeniVergi)}</div>
                    <div className="text-[11px] text-slate-400 mt-1">Toplam kümülatif tutar</div>
                  </div>

                  <div className="bg-emerald-950/30 border border-emerald-500/60 rounded-xl p-4">
                    <div className="text-xs text-emerald-300 font-semibold">Bu Ayın Gelir Vergisi</div>
                    <div className="text-lg font-mono tabular-nums font-bold text-white mt-1.5">{formatTL(serbestAylikVergi)}</div>
                    <div className="text-[11px] font-mono text-emerald-300/90 mt-1">
                      Yeni vergi - Önceki vergi
                    </div>
                  </div>
                </div>

                {/* Yatay Dağılım Görseli */}
                <YatayDilimDagilimGorseli oncekiMatrah={serbestOnceki} cariMatrah={serbestCari} gosterOncekiAyrim={true} />

                {/* Cari Ay Matrahının Vergi Dilimlerine Dağılımı */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                  <div className="bg-slate-900 px-5 py-3 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <span className="text-sm font-semibold text-white">Cari Ay Matrahının Dilimlere Dağılımı</span>
                    <span className="text-xs font-mono tabular-nums text-emerald-300">
                      Cari Ay Toplamı: {formatTL(serbestCari)} → Vergi: {formatTL(serbestAylikVergi)}
                    </span>
                  </div>

                  <div className="divide-y divide-slate-800/80 text-xs sm:text-sm">
                    {serbestCariDagilim.map((d) => (
                      <div
                        key={d.id}
                        className={`px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 ${
                          d.aktif ? 'text-slate-100' : 'text-slate-500'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <span className={`w-2.5 h-2.5 rounded-sm shrink-0 ${d.barClass}`} aria-hidden="true" />
                          <span className="font-semibold">{d.ad}</span>
                          <span className="text-xs text-slate-400 font-mono">
                            ({formatTL(d.altSinir)} – {d.ustSinir === null ? 'Üzeri' : formatTL(d.ustSinir)})
                          </span>
                        </div>
                        <div className="font-mono tabular-nums text-right">
                          {d.aktif ? (
                            <span>
                              {formatTL(d.cariDilimTutar)} × {d.oranYuzde} = <strong className="text-white">{formatTL(d.cariDilimVergi)}</strong>
                            </span>
                          ) : (
                            <span>Bu dilime tutar girmedi (0,00 TL)</span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Önemli Uyarılar (Açılır-Kapanır Bilgilendirme) */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                  <button
                    onClick={() => setUyarilarAcik((prev) => !prev)}
                    className="w-full flex items-center justify-between text-left text-xs font-semibold text-slate-200 cursor-pointer min-h-[36px]"
                  >
                    <span className="flex items-center gap-2">
                      <IconInfo />
                      <span>Önemli Metodoloji ve Eğitim Kapsamı Uyarıları</span>
                    </span>
                    <span className="text-sky-400">{uyarilarAcik ? 'Gizle' : 'Göster'}</span>
                  </button>
                  {uyarilarAcik && (
                    <ul className="mt-3 pt-3 border-t border-slate-800 space-y-2 text-xs text-slate-300 leading-relaxed list-disc pl-4">
                      {ONEMLI_UYARILAR.map((u, idx) => (
                        <li key={idx}>{u}</li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    onClick={() => derseGit(6)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors cursor-pointer min-h-[44px]"
                  >
                    <IconArrowLeft />
                    <span>Önceki Bölüm</span>
                  </button>
                  <button
                    onClick={() => derseGit(1)}
                    className="px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 transition-colors cursor-pointer min-h-[44px]"
                  >
                    Başa Dön (Bölüm 1)
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // =========================================================================
      // ANA UYGULAMA KABUĞU (TEK DOSYA - 3 BÖLGELİ ÜST BAR VE URL SYNC)
      // =========================================================================
      function App() {
        // URL hash veya search parametrelerinden durum okuma
        const getInitialState = () => {
          const hash = window.location.hash.replace('#', '');
          const params = new URLSearchParams(window.location.search);
          const modul = params.get('modul') || (hash.includes('akademi') ? 'akademi' : 'brutten-nete');
          return modul;
        };

        const [aktifModul, setAktifModulState] = useState(getInitialState());
        const [paylasimKopyalandi, setPaylasimKopyalandi] = useState(false);

        const setAktifModul = (modul) => {
          setAktifModulState(modul);
          const url = new URL(window.location.href);
          url.searchParams.set('modul', modul);
          window.history.replaceState({}, '', url);
        };

        // URL üzerinden senkronizasyon dinleyicisi (Öğrenci linke tıkladığında eşzamanlı güncellenir)
        React.useEffect(() => {
          const handlePopState = () => {
            const params = new URLSearchParams(window.location.search);
            const modul = params.get('modul');
            if (modul && (modul === 'brutten-nete' || modul === 'akademi')) {
              setAktifModulState(modul);
            }
          };
          window.addEventListener('popstate', handlePopState);
          return () => window.removeEventListener('popstate', handlePopState);
        }, []);

        const paylasimLinkiOlustur = () => {
          const url = window.location.href;
          navigator.clipboard.writeText(url).then(() => {
            setPaylasimKopyalandi(true);
            setTimeout(() => setPaylasimKopyalandi(false), 3000);
          }).catch(() => {
            prompt("Eğitmen / Öğrenci Paylaşım Linkiniz:", url);
          });
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
            {/* 3 Bölgeli Üst Bar Sözleşmesi: Marka | Tek Satır Modül Linkleri | Birincil Aksiyon */}
            <header className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4 sm:gap-8">
                {/* Bölge 1: Marka (Tek satır, alt başlıksız) */}
                <button
                  onClick={() => setAktifModul('brutten-nete')}
                  className="text-base sm:text-lg font-bold tracking-tight text-white whitespace-nowrap shrink-0 cursor-pointer text-left"
                >
                  Bordro Akademisi
                </button>

                {/* Bölge 2: Modül Gezinti Linkleri */}
                <nav className="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm font-medium overflow-x-auto">
                  <button
                    onClick={() => setAktifModul('brutten-nete')}
                    className={`py-1.5 border-b-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      aktifModul === 'brutten-nete'
                        ? 'border-sky-500 text-white'
                        : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Temel Hesaplama Modülü
                  </button>
                  <button
                    onClick={() => setAktifModul('akademi')}
                    className={`py-1.5 border-b-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                      aktifModul === 'akademi'
                        ? 'border-sky-500 text-white'
                        : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Gelir Vergisi Akademisi
                  </button>
                </nav>

                {/* Bölge 3: Tek Birincil Geçiş Butonu ve Canlı Paylaşım Linki */}
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    onClick={paylasimLinkiOlustur}
                    className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 transition-colors whitespace-nowrap cursor-pointer"
                    title="Eğitmen ve öğrencinin eşzamanlı çalışabilmesi için mevcut sayfa linkini kopyala"
                  >
                    {paylasimKopyalandi ? (
                      <>
                        <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                        <span>Link Kopyalandı!</span>
                      </>
                    ) : (
                      <>
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 75.05 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>Canlı Paylaşım Linki</span>
                      </>
                    )}
                  </button>

                  <button
                    onClick={() => setAktifModul(aktifModul === 'akademi' ? 'brutten-nete' : 'akademi')}
                    className="hidden sm:flex px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                  >
                    {aktifModul === 'akademi' ? 'Temel Hesaplamaya Geç' : 'Akademiye Geç'}
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">
              {aktifModul === 'brutten-nete' ? <BruttenNeteModulu /> : <GelirVergisiAkademisi />}
            </main>

            <footer className="border-t border-slate-800/80 py-5 px-4 text-center text-xs text-slate-500">
              Bordro Akademisi · Canlı Eğitim & Eşzamanlı Öğrenci Senkronizasyon Altyapısı
            </footer>
          </div>
        );
      }

      const rootEl = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootEl).render(<App />);
      } else {
        ReactDOM.render(<App />, rootEl);
      }
    </script>
  </body>
</html>
